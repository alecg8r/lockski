name: live results
# Every 10 minutes from 1 PM to 2 AM Eastern (17:00-07:00 UTC), grade finished games so the app's record,
# graphs and bets settle minutes after the horn. Netlify redeploys automatically when data/ changes.
on:
  schedule:
    - cron: "*/10 17-23 * * *"
    - cron: "*/10 0-7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-results
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/settle_live.py
      - name: commit if anything settled
        run: |
          if git diff --quiet data/; then echo "no change"; exit 0; fi
          git config user.name "lockski"
          git config user.email "lockski@users.noreply.github.com"
          git add data/ledger.json
          git commit -m "results: live settle $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin main
