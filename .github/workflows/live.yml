name: live
# lockski.ai live engine, around the clock. Every 10 minutes GitHub starts a run; each run does up to 3 cycles
# ~3 minutes apart (so a skipped or late cron still leaves no long gap). A cycle: pregame inputs (9am-10pm ET),
# grade finals from the NHL feed, score every shot from the play-by-play, rerun the model, validate, publish data/.
# The app reads data/ straight from GitHub, so none of this redeploys the site.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-publish
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r engine/requirements.txt
      - name: cycles
        run: |
          rc=0
          for i in 1 2 3; do
            echo "=== cycle $i $(date -u +%T) ==="
            bash tools/cycle.sh || rc=1
            [ $i -lt 3 ] && sleep 170
          done
          exit $rc
