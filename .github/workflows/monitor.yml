name: monitor
# Real checks every 30 minutes: site up, bet store answering, NHL proxy answering, data fresh, inputs fresh,
# last engine cycle ok. Writes data/health.json (healthy / degraded / offline per subsystem). The job fails
# (GitHub emails the owner) only when something is offline, so a quiet month stays quiet.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 tools/health_check.py; rc=$?
          if [ -n "$(git status --porcelain data/health.json)" ]; then
            git config user.name lockski; git config user.email lockski@users.noreply.github.com
            git add data/health.json && git commit -q -m "health $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          fi
          exit $rc
