name: probe-sources
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/p && cd /tmp/p && python3 $GITHUB_WORKSPACE/tools/probe_sources.py
          cd $GITHUB_WORKSPACE && git checkout --orphan probe-data && git rm -rfq . && cp /tmp/p/probe_* . && git add . 
          git -c user.name=lockski -c user.email=lockski@users.noreply.github.com commit -qm probe && git push -f origin probe-data
