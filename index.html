<style>
/* lockski.ai v2: black and white, plain words. Team colors appear only on team badges. Single dark theme by design. */
:root {
  --bg: #000; --card: #0e0e0e; --raise: #171717; --line: #262626;
  --fg: #fff; --muted: #a3a3a3; --dim: #6b6b6b;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 20px; --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
.scroller { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; }
body { color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-transform: lowercase; font-optical-sizing: auto; }
/* lowercase is the theme: everything reads like the wordmark. team letters inside badges stay as they are. */
.tb i { text-transform: uppercase; } button, select, textarea { text-transform: inherit; } input { text-transform: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, a { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 8px; }

.app { max-width: 560px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 22px; }
.wm { height: 20px; width: auto; display: block; color: var(--fg); }
.rbtn { appearance: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.rbtn svg { width: 17px; height: 17px; } .rbtn:hover { color: var(--fg); border-color: var(--muted); }
.rbtn.busy svg { animation: spin 1.1s linear infinite; color: var(--fg); }
@keyframes spin { to { transform: rotate(360deg); } }

.view { display: grid; gap: 16px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
h1 { margin: 0; font-size: clamp(28px, 8vw, 36px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; max-width: 44ch; }
.sec { margin: 8px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: lowercase; letter-spacing: .08em; }
.fine { color: var(--dim); font-size: 12px; text-align: center; margin: 4px 0 0; }

/* Team badge: team colors + letters (not official logos) */
.tb { --c: #333; --t: #fff; width: 44px; height: 44px; border-radius: 50%; color: var(--t); display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.30), rgba(255,255,255,0) 52%), var(--c);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.16), inset 0 -4px 10px rgba(0,0,0,.28), 0 6px 16px -8px var(--c);
  font-weight: 700; font-size: 13px; letter-spacing: -.01em; text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.tb.s { width: 30px; height: 30px; font-size: 10px; } .tb.l { width: 64px; height: 64px; font-size: 18px; } .tb.xl { width: 92px; height: 92px; font-size: 26px; }
/* Real team logos load from the NHL's own image server on top of the badge; if one can't load, the lettered badge stays. */
.tb { position: relative; overflow: hidden; } .tb i { font-style: normal; }
/* player headshots (official NHL photos): same circle as a team badge, team logo tucked in the corner */
.pf { position: relative; display: inline-block; width: 44px; height: 44px; flex: none; } .pf.s { width: 30px; height: 30px; } .pf.l { width: 64px; height: 64px; } .pf.xl { width: 92px; height: 92px; }
.pf .hs { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: #141414; box-shadow: inset 0 0 0 1px #2a2a2a; display: block; }
.pf > .tb.s { position: absolute; right: -3px; bottom: -3px; width: 42%; height: 42%; font-size: 0; box-shadow: 0 0 0 2px var(--bg); }
.pf.nohs > .hs { visibility: hidden; } .pf.nohs > .tb.s { right: 0; bottom: 0; width: 100%; height: 100%; box-shadow: none; font-size: 10px; }
.tb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 9%; opacity: 0; transition: opacity .25s; }
.tb.lg { background: #141414; box-shadow: inset 0 0 0 1px #2a2a2a; } .tb.lg img { opacity: 1; } .tb.lg i { visibility: hidden; }

/* Home */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; } .hello .d { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: lowercase; }
.sh { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; } .sh h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.sh button { appearance: none; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0; }
.lotd { --tc: #444; position: relative; overflow: hidden; border-radius: 24px; padding: 16px; display: grid; gap: 14px; cursor: pointer;
  background: linear-gradient(165deg, #161616, #060606 70%); border: 1px solid #2f2f2f; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); }
.lotd::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 60% at 100% 0%, color-mix(in srgb, var(--tc) 38%, transparent), transparent 70%); }
.lotd > * { position: relative; }
.lotd .lh { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: lowercase; color: var(--muted); }
.lotd .lh span:first-child { display: inline-flex; align-items: center; gap: 7px; color: var(--fg); } .lotd .lh svg { width: 14px; height: 14px; }
.lotd .core { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; } .lotd .tnw { min-width: 0; }
.lotd .big2 { text-align: right; line-height: .9; } .lotd .big2 b { font-size: 48px; font-weight: 700; letter-spacing: -0.05em; } .lotd .big2 small { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; letter-spacing: 0; }
.lotd .tn { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; } .lotd .vs2 { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.lotd .callrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid #2a2a2a; }
.lotd .callrow b { font-size: 18px; font-weight: 700; white-space: nowrap; } .lotd .callrow span { font-size: 13px; color: var(--muted); text-align: right; }
.lotd .callrow.take { background: var(--fg); border-color: var(--fg); } .lotd .callrow.take b { color: #000; } .lotd .callrow.take span { color: #333; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost { appearance: none; height: 48px; border-radius: 14px; border: 1.5px solid #fff; background: transparent; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
.ghost.done { border-color: #3a3a3a; color: var(--muted); }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 172px; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; } .rail .bet { scroll-snap-align: start; aspect-ratio: auto; min-height: 0; }
.track { appearance: none; width: 100%; text-align: left; color: inherit; cursor: pointer; display: grid; gap: 10px; padding: 16px; border-radius: 20px; border: 1px solid var(--line);
  background: radial-gradient(90% 120% at 0% 0%, rgba(34,197,94,.10), transparent 60%), var(--card); }
.track .trh { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
.track .trb { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; } .track .trb > b { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; } .track .trb span { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; } .chips i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 4px 6px; border-radius: 7px; text-transform: uppercase; }
.chips i.w { background: rgba(34,197,94,.18); color: #4ade80; } .chips i.l { background: rgba(239,68,68,.16); color: #f87171; }
.money { appearance: none; width: 100%; text-align: left; color: inherit; display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.money b { font-size: 26px; font-weight: 700; letter-spacing: -.02em; display: block; line-height: 1.1; } .money span { font-size: 13px; color: var(--muted); }
.money svg { width: 110px; height: 40px; } .money svg polyline { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
.tg { appearance: none; width: 100%; color: inherit; display: grid; grid-template-columns: 62px minmax(0, 1fr) minmax(0, 1fr) 18px; gap: 8px; align-items: center; padding: 11px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.tg .tt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; } .tg .s2 { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 14px; }
.tg .s2 em { font-style: normal; font-weight: 600; color: var(--muted); font-size: 13px; } .tg .s2.f em { color: var(--fg); font-weight: 700; } .tg .ck { font-size: 13px; text-align: right; }
.hot2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .hot2 > div { padding: 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 9px; }
.hot2 h3 { margin: 0; font-size: 11.5px; color: var(--muted); letter-spacing: .12em; text-transform: lowercase; }
.hot2 .hr { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 700; } .hot2 .hr span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hot2 .hr b { font-size: 16px; font-weight: 700; }
.recline { appearance: none; width: 100%; text-align: left; color: inherit; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.recline b { font-size: 18px; font-weight: 700; }
/* Parlay */
.slipbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: min(528px, calc(100% - 24px));
  appearance: none; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 16px; background: #fff; color: #000; box-shadow: 0 14px 40px -12px rgba(0,0,0,.8); animation: up .25s both; }
.slipbar b { font-size: 15px; font-weight: 700; } .slipbar span { font-size: 13px; font-weight: 600; color: #333; }
.slipbar .cnt { background: #000; color: #fff; border-radius: 999px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; margin-right: 8px; padding: 0 6px; }
body.has-slip .app { padding-bottom: calc(var(--nav-h) + 110px + env(safe-area-inset-bottom, 0px)); }
.addleg { appearance: none; width: 100%; height: 46px; border-radius: 14px; border: 1.5px dashed #555; background: transparent; color: var(--fg); font-weight: 700; font-size: 14px; cursor: pointer; }
.addleg.in { border-style: solid; border-color: var(--fg); }
.alt { appearance: none; border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; }
.plus { appearance: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #555; background: transparent; color: var(--fg); font-size: 17px; font-weight: 700; line-height: 1; cursor: pointer; display: grid; place-items: center; margin: -6px -4px 0 0; }
.plus.in { background: var(--fg); color: #000; border-color: var(--fg); font-size: 13px; }
.leg { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 28px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #000; border: 1px solid var(--line); }
.leg .g { font-weight: 700; font-size: 14px; min-width: 0; } .leg small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.leg .v { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; } .leg .v small { font-size: 11.5px; }
.leg .rm { appearance: none; border: 0; background: var(--raise); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; }
.pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .pstats div { padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 2px; }
.pstats b { font-size: 30px; font-weight: 700; letter-spacing: -.03em; } .pstats span { font-size: 12.5px; color: var(--muted); }
.sugg { display: grid; gap: 12px; padding: 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
.sugg .legs { display: flex; flex-wrap: wrap; gap: 8px; } .sugg .legs > span { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #000; border: 1px solid var(--line); }
.sugg .nums { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); } .sugg .nums b { color: var(--fg); font-size: 18px; }
.stack { display: flex; width: 30px; } .stack .tb { width: 21px; height: 21px; font-size: 0; margin-left: -12px; } .stack .tb:first-child { margin-left: 0; } .recline span { color: var(--muted); font-size: 13.5px; }

/* Bet cards */
.bets { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.bet { aspect-ratio: 1 / 1.12; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .2s, transform .2s; min-width: 0; }
.bet:hover { border-color: #555; } .bet:active { transform: scale(.98); }
.bet .lab { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: lowercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.bet .lab .hd { color: var(--fg); }
.bet .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bet .pc { text-align: right; line-height: 1; } .bet .pc b { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; } .bet .pc small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
.bet .tm { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bet .gm { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.go { margin-top: auto; justify-self: start; align-self: flex-start; appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 15px; border-radius: 999px;
  background: #fff; color: #000; font-weight: 700; font-size: 13px; letter-spacing: -.01em; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap; transition: transform .15s, background .15s; }
.go:hover { background: #e8e8e8; } .go:active { transform: scale(.97); }
.go svg { width: 15px; height: 15px; flex: none; transition: transform .2s; } .go:hover svg { transform: translateX(3px); }
.go.wide { height: 36px; }
.flag { font-size: 10.5px; font-weight: 700; color: #000; background: var(--fg); border-radius: 6px; padding: 1px 6px; letter-spacing: .04em; text-transform: none; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 6px; } .empty b { font-size: 17px; } .empty p { margin: 0; color: var(--muted); font-size: 14px; }

/* Lists */
.list { display: grid; gap: 8px; }
.row2 { appearance: none; width: 100%; text-align: left; display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) 56px; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: inherit; }
.row2 .rk { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row2 .who { min-width: 0; display: grid; gap: 6px; }
.row2 .nm { display: flex; align-items: baseline; gap: 8px; min-width: 0; } .row2 .nm b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row2 .nm span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar { height: 5px; border-radius: 999px; background: var(--raise); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--fg); border-radius: inherit; transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.row2 .sc { font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; max-width: 360px; }
.seg button { appearance: none; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: #000; }

/* Games */
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.strip::-webkit-scrollbar { display: none; }
.day { appearance: none; flex: none; width: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 8px 0 7px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.day .dw { font-size: 10px; letter-spacing: .12em; text-transform: lowercase; color: var(--muted); font-weight: 700; } .day .dn { font-weight: 700; font-size: 19px; }
.day[aria-pressed="true"] { background: var(--fg); color: #000; border-color: var(--fg); } .day[aria-pressed="true"] .dw { color: #000; }
.game { appearance: none; width: 100%; text-align: left; color: inherit; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 10px; cursor: pointer; }
.game.past { opacity: .45; } .game.on { border-color: #555; }
.feedline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); } .feedline i { width: 8px; height: 8px; border-radius: 50%; background: #555; } .feedline.on i { background: #fff; animation: pulse 1.2s ease-in-out infinite; }
.livepill { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 700; } .livepill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.side .n span .lsc { font-size: 20px; font-weight: 700; color: var(--dim); } .side .n span .lsc.w { color: var(--fg); }
.gtop { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.gteams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; } .side.r { flex-direction: row-reverse; text-align: right; }
.side .n { display: grid; min-width: 0; } .side .n b { font-size: 16px; font-weight: 700; } .side .n span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side.fav .n span { color: var(--fg); font-weight: 700; }
.at { color: var(--dim); font-size: 12px; }
.split { height: 5px; border-radius: 999px; overflow: hidden; display: flex; gap: 2px; } .split i { display: block; height: 100%; border-radius: 999px; } .split .a { background: #555; } .split .h { background: var(--fg); }
.split.af .a { background: var(--fg); } .split.af .h { background: #555; }

/* Results */

.legend .lg-g::before { background: #22c55e; height: 8px; } .legend .lg-r::before { background: #ef4444; height: 8px; } .legend .l2::before { background: repeating-linear-gradient(90deg, #fff 0 5px, transparent 5px 9px); } .legend .l3::before { background: repeating-linear-gradient(90deg, #555 0 3px, transparent 3px 7px); } .legend .l4::before { height: 10px; background: transparent; border: 1.5px dashed #fff; border-radius: 2px; }

/* Bottom tabs */

  background: rgba(0,0,0,.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }

nav.tabs button { appearance: none; border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--dim); font-size: 11px; font-weight: 700; }
nav.tabs button svg { width: 22px; height: 22px; } nav.tabs button[aria-selected="true"] { color: var(--fg); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: min(440px, calc(100% - 32px));
  background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; animation: up .25s both; }

/* Intro: typewriter */
#intro { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; cursor: pointer; transition: opacity .9s ease; }
#intro.out { opacity: 0; pointer-events: none; }
#intro .iwm { width: min(240px, 58vw); height: auto; color: #fff; overflow: visible; transition: opacity .55s ease, transform .55s ease; }
#intro.p2 .iwm { opacity: 0; transform: scale(.96); }
/* screen 2: its own black screen, message typed in the middle, the lock rises from the bottom and waves */
#intro .iscr2 { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none; overflow: hidden; }
#intro .itag { margin: 0; min-height: 30px; font-size: 24px; font-weight: 600; letter-spacing: -.02em; color: #fff; text-transform: lowercase; display: flex; align-items: center; }
#intro .itag i { display: inline-block; width: 3px; height: 26px; background: #fff; margin-left: 3px; visibility: hidden; } #intro .itag.on i { visibility: visible; animation: blink 1s steps(1) infinite; }
#intro .imas { width: 116px; height: 116px; margin-top: 34px; opacity: 0; transform: translateX(-75vw); }
#intro .imas svg { width: 100%; height: 100%; overflow: visible; }
#intro .imas .lk-line { stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
#intro .imas.in { animation: imas-roll-in 1s cubic-bezier(.25,.8,.35,1) forwards; }
#intro .imas.out { animation: imas-roll-out .85s cubic-bezier(.55,0,.8,.4) forwards; }
#intro .imas.wave .wave { transform-box: fill-box; transform-origin: 0% 100%; animation: imas-wave .3s ease-in-out 6 alternate; }
/* rolls in from the left (two full turns), stops upright in the middle, waves, rolls off to the right */
@keyframes imas-roll-in { 0% { opacity: 1; transform: translateX(-75vw) rotate(-720deg); } 88% { opacity: 1; transform: translateX(6px) rotate(8deg); } 100% { opacity: 1; transform: translateX(0) rotate(0); } }
@keyframes imas-roll-out { 0% { opacity: 1; transform: translateX(0) rotate(0); } 100% { opacity: 1; transform: translateX(80vw) rotate(720deg); } }
@keyframes imas-wave { from { transform: rotate(-25deg); } to { transform: rotate(35deg); } }
#intro .iwm path { visibility: hidden; } #intro .iwm path.on { visibility: visible; }
#intro .cur { fill: #fff; } #intro .cur.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#intro .skip { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 11px; color: #444; letter-spacing: .12em; text-transform: lowercase; }

/* Win celebration: the lock jumps for joy and the payout pops in green. Once per winning bet; several at once are added up. */
#cel { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
#cel.on { opacity: 1; } #cel[hidden] { display: none; }
#cel .cw { display: grid; justify-items: center; gap: 10px; text-align: center; }
#cel .cl { width: 92px; height: 92px; animation: cel-jump .7s cubic-bezier(.3,0,.3,1) infinite; transform-origin: 50% 100%; }
#cel .cl svg { width: 100%; height: 100%; overflow: visible; }
#cel .cl .lk-line { stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
#cel .cl .lk-arm { transform-box: fill-box; animation: cel-wave .35s ease-in-out infinite alternate; }
#cel .cl .lk-arm[data-s="-1"] { transform-origin: 100% 100%; } #cel .cl .lk-arm[data-s="1"] { transform-origin: 0% 100%; animation-direction: alternate-reverse; }
#cel .amt { color: #4ade80; font-size: 56px; font-weight: 700; letter-spacing: -.04em; line-height: 1; transform: scale(.3); opacity: 0; }
#cel.on .amt { animation: cel-pop .6s .25s cubic-bezier(.2,1.6,.4,1) forwards; }
#cel .sub { color: var(--muted); font-size: 14px; opacity: 0; } #cel.on .sub { animation: cel-fade .4s .6s forwards; }
#cel .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; opacity: 0; }
#cel.on .dot { animation: cel-spark 1.1s .2s ease-out forwards; }
@keyframes cel-jump { 0%, 100% { transform: translateY(0) scale(1.08, .9); } 20% { transform: translateY(0) scale(1); } 50% { transform: translateY(-34px) scale(.96, 1.05); } }
@keyframes cel-wave { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
@keyframes cel-pop { to { transform: scale(1); opacity: 1; } }
@keyframes cel-fade { to { opacity: 1; } }
@keyframes cel-spark { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } }
@media (prefers-reduced-motion: reduce) { #cel .cl, #cel .cl .lk-arm { animation: none; } #cel.on .amt { animation: cel-fade .3s forwards; transform: none; } #cel .dot { display: none; } }
/* Pull to refresh: the page drops down and a little stick-figure lock hangs into the gap (stretching if you keep pulling).
   Let go and it cartwheels left and right while everything refreshes, then lands and the page springs back. */
#ptr { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 0; z-index: 35; pointer-events: none; }
#ptr .lk-x { position: absolute; left: 50%; top: 0; width: 34px; height: 34px; margin-left: -17px; opacity: 0; transform: translateY(-48px); }
#ptr .lk-y { width: 100%; height: 100%; transform-origin: 50% 0; }
#ptr svg { display: block; width: 34px; height: 34px; overflow: visible; }
#ptr .lk-line { stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
#ptr.busy .lk-y { transform-origin: 50% 100%; animation: lk-hop .65s cubic-bezier(.3,0,.3,1) infinite; }
#ptr.busy svg { animation: lk-cart 2.6s ease-in-out infinite; }
#ptr.land .lk-y { transform-origin: 50% 100%; animation: lk-land .32s ease-out; }
@keyframes lk-cart { 0% { transform: translateX(0) rotate(0); } 25% { transform: translateX(54px) rotate(360deg); } 50% { transform: translateX(0) rotate(0); } 75% { transform: translateX(-54px) rotate(-360deg); } 100% { transform: translateX(0) rotate(0); } }
@keyframes lk-hop { 0%, 100% { transform: translateY(0) scale(1.06, .9); } 18% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(.97, 1.04); } }
@keyframes lk-land { 0% { transform: scale(1.14, .84); } 60% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #ptr.busy svg { animation: lk-pulse 1s ease-in-out infinite; } #ptr.busy .lk-y, #ptr.land .lk-y { animation: none; } }
@keyframes lk-pulse { 50% { opacity: .45; } }
.loading { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .sk { aspect-ratio: 1; border-radius: var(--r); background: linear-gradient(90deg, var(--card), var(--raise), var(--card)); background-size: 200% 100%; animation: sh 1.4s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }

  document.addEventListener("touchstart", e => { if (busy || !$("sheet").hidden) return; y0 = $("scroller").scrollTop <= 0 ? e.touches[0].clientY : null; d = 0; armed = false; ease(app, false); ease(lx, false); }, { passive: true });
  document.addEventListener("touchmove", e => { if (y0 == null) return; const raw = e.touches[0].clientY - y0;
    if (raw <= 0 || $("scroller").scrollTop > 0) { d = 0; pose(0); return; }
    d = Math.min(150, raw * .5); armed = d >= HOLD; pose(d); }, { passive: true });
  document.addEventListener("touchend", async () => { if (y0 == null) return; y0 = null;
    ease(app, true); ease(lx, true);
    if (!armed) { pose(0); return; }
    pose(HOLD); await doRefresh(true); });
  async function doRefresh(pulled) {
    if (busy) return; busy = true;
    if (!pulled) { ease(app, true); ease(lx, true); pose(HOLD); }
    ly.style.transform = ""; setArms(1); bar.classList.remove("land"); bar.classList.add("show", "busy"); lab.textContent = "refreshing…";
    const t0 = Date.now();
    try { await Promise.all([DB ? resync() : null, liveFetch()]); render(); renderSlipBar(); } catch (e) { console.warn(e); }
    const h = dataAgeH(), when = S.meta && S.meta.lastSync ? new Date(S.meta.lastSync).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    // finish the cartwheel he's in: stop only when he's back upright in the middle (every CYCLE ms), at least one full cartwheel
    const el = Date.now() - t0; await new Promise(r => setTimeout(r, Math.max(CYCLE, Math.ceil(el / CYCLE) * CYCLE) - el));
    bar.classList.remove("busy"); void bar.offsetWidth; bar.classList.add("land");
    lab.textContent = when ? `up to date · last full update ${when}` : "up to date";
    await new Promise(r => setTimeout(r, 380));
    pose(0); lx.style.opacity = 0;
    setTimeout(() => { bar.classList.remove("land", "show"); busy = false; }, 420);
  }
  window.lockskiRefresh = doRefresh;
  // Claude preview only (no pull-down there: it closes the preview): tap the lockski.ai logo to play the refresh. The real app is unchanged.
  if (typeof BETS_MODE === "undefined") { $("foot").addEventListener("click", () => celebrate(29.6, 9.6, 2)); const wm = document.querySelector(".top .wm"); if (wm) { wm.style.cursor = "pointer"; wm.addEventListener("click", () => doRefresh(false)); } }
})();
// One-shot re-read of everything the page shows (the live listeners already push changes; this forces it, instantly).
async function resync() {
  const got = async (fn) => { try { return await fn(); } catch (e) { console.warn(e); return null; } };
  const [wk, st, md, lg, bt] = await Promise.all([
    got(() => DB.collection("weeks").get()), got(() => DB.doc("meta/status").get()), got(() => DB.doc("model/current").get()),
    got(() => DB.collection("ledger").get()), got(() => DB.collection("bets").get())]);
  if (wk && wk.docs) { const w = {}; wk.docs.forEach(d => { if (d.exists) w[d.id] = d.data(); }); if (Object.keys(w).length) S.weeks = w; }
  if (st && st.exists) S.meta = st.data();
  if (md && md.exists && md.data().teams) S.model = md.data();
  if (lg && lg.docs) { const L = {}; lg.docs.forEach(d => { if (d.exists) L[d.id] = d.data(); }); if (Object.keys(L).length) S.ledger = L; }
  if (bt && bt.docs) { const B = {}; bt.docs.forEach(d => { if (d.exists) B[d.id] = d.data(); }); S.bets = B; }
}
/* ---------------- Tabs ---------------- */
const VIEWS = ["bets", "hot", "games", "mine", "results"];
function setView(v, push) {
  S.view = v;
  VIEWS.forEach(x => { $("t-" + x).setAttribute("aria-selected", x === v); const s = $("v-" + x);
    if (x === v) { s.hidden = false; s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; } else s.hidden = true; });
  try { localStorage.setItem("lk-view2", v); } catch {}
  if (push) { try { history.replaceState(null, "", "#" + v); } catch {} $("scroller").scrollTo({ top: 0, behavior: "smooth" }); }
}
VIEWS.forEach(x => $("t-" + x).addEventListener("click", () => setView(x, true)));
/* Always open on Home (the "bets" tab), ignoring the URL hash and the last tab used. */
setView("bets", false);

/* ---------------- Intro: slow typewriter, then a plain fade ----------------
   LOCKED: Alec approved this intro (Oct 24, 2026) and asked that it never change. Keep its markup, CSS and timing exactly as is. */
(function intro() {
  const el = $("intro");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }
  const paths = [...el.querySelectorAll(".iwm path")], cur = el.querySelector(".cur"), tag = el.querySelector(".itag"), tagT = tag.querySelector("span"), mas = el.querySelector(".imas");
  const edge = [155, 670, 1169, 1592, 2011, 2446, 2624];   // right edge of each letter of "lockski"
  let done = false, timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const finish = () => { if (done) return; done = true; timers.forEach(clearTimeout); paths.forEach(p => p.classList.add("on")); el.classList.add("out"); setTimeout(() => el.remove(), 950); };
  el.addEventListener("click", finish);
  cur.classList.add("blink");
  let t = 900;                                                    // cursor blinks alone first (unchanged timing)
  paths.forEach((p, i) => {
    t += 230 + Math.random() * 120;                              // slower, uneven keystrokes
    at(t, () => { cur.classList.remove("blink"); p.classList.add("on"); cur.setAttribute("x", edge[i] + 30); });
  });
  at(t + 150, () => cur.classList.add("blink"));
  // screen 2: the logo fades to black, "got it on lockski" types out, the lock rises from the bottom and waves, then home
  const msg = "got it on lockski"; let u = t + 1300;
  at(u, () => { el.classList.add("p2"); cur.style.visibility = "hidden"; });
  u += 700; at(u, () => tag.classList.add("on"));
  u += 250; [...msg].forEach((c, i) => { u += 60 + Math.random() * 50 + (c === " " ? 50 : 0); at(u, () => { tagT.textContent = msg.slice(0, i + 1); }); });
  at(u + 300, () => { tag.classList.remove("on"); mas.classList.add("in"); });          // rolls in from the left
  at(u + 1350, () => mas.classList.add("wave"));                                        // stops and waves
  at(u + 3300, () => { mas.classList.remove("wave", "in"); mas.style.opacity = 1; mas.classList.add("out"); });   // rolls off to the right
  at(u + 4050, finish);                                                                 // then home
})();

/* ---------------- Data ---------------- */
(function () {
  try { const snap = JSON.parse($("snap").textContent); S.weeks = snap.weeks || {}; S.meta = snap.meta || null; S.model = snap.model || null; S.ledger = snap.ledger || {}; }
  catch (e) { console.warn("No saved snapshot", e); }
})();
render(); renderSlipBar();
liveFetch().then(ok => { renderFoot(); if (ok) { render(); } });
(function livePoll() {
  const tick = async () => { const ok = await liveFetch(); if (ok) { try { if (S.view === "games") renderGames(); if (S.view === "mine") renderMine(); if (S.view === "bets") renderBets(); if (S.view === "results") renderResults(); renderFoot(); } catch (e) { console.warn(e); } }
    const anyOn = Object.values(LIVE.games).some(l => l.live); setTimeout(tick, LIVE.state === "on" ? (anyOn ? 20000 : 60000) : 120000); };
  setTimeout(tick, 20000);
  setInterval(() => { const f = $("feedline"); if (f) { f.innerHTML = feedStatus(); f.classList.toggle("on", LIVE.state === "on"); } }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
})();
(async function connect() {
  const db = makeStore();
  try { await db.loadFiles(); DB_STATE = "live"; } catch (e) { console.warn("data files", e); DB_STATE = "offline"; }
  try { await db.loadBets(); BETS_MODE = "api"; } catch (e) { console.warn("bet store not available, keeping bets on this device", e); BETS_MODE = "local"; }
  DB = db;
  try { renderBets(); renderMine(); } catch {}
  // Move any bets saved on this device while offline into the account database, then clear the local copy.
  (async () => {
    const local = LOCAL_BETS(), ids = Object.keys(local); if (!ids.length || BETS_MODE !== "api") return;
    let moved = 0;
    for (const id of ids) { try { await db.collection("bets").add(local[id]); moved++; delete local[id]; } catch (e) { console.warn(e); } }
    try { localStorage.setItem("lk-bets", JSON.stringify(local)); } catch {}
    if (moved) toast(`<b>Synced.</b> ${moved} bet${moved > 1 ? "s" : ""} from this device saved to your account.`, 6000);
  })();
  const fail = e => console.warn("Live data error", e);
  try {
    db.collection("weeks").onSnapshot(snap => { const w = {}; snap.docs.forEach(d => { if (d.exists) w[d.id] = d.data(); }); if (Object.keys(w).length) { S.weeks = w; render(); } }, fail);
    db.doc("meta/status").onSnapshot(d => { if (d.exists) { S.meta = d.data(); renderFoot(); } }, fail);
    db.doc("model/current").onSnapshot(d => { if (d.exists && d.data().teams) { S.model = d.data(); render(); renderSlipBar(); } }, fail);
    db.collection("ledger").onSnapshot(snap => { const L = {}; snap.docs.forEach(d => { if (d.exists) L[d.id] = d.data(); }); if (Object.keys(L).length) { S.ledger = L; try { renderResults(); renderMine(); renderBets(); } catch (e) { console.error(e); } } }, fail);
    db.collection("bets").onSnapshot(snap => { const B = {}; snap.docs.forEach(d => { if (d.exists) B[d.id] = d.data(); }); S.bets = B; try { renderMine(); renderResults(); renderBets(); } catch (e) { console.error(e); } }, fail);
    db.doc("settings/tracker").onSnapshot(d => { if (d.exists && Number(d.data().unit) > 0) { S.unit = Number(d.data().unit); try { renderMine(); } catch {} } }, fail);
  } catch (e) { fail(e); }
  setInterval(() => { if (!document.hidden) db.loadFiles().catch(() => {}); }, 60 * 1000);
  setInterval(() => { if (!document.hidden && BETS_MODE === "api") db.loadBets().catch(() => {}); }, 30 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { db.loadFiles().catch(() => {}); if (BETS_MODE === "api") db.loadBets().catch(() => {}); } });
  // bring over any bets placed in the Claude app (data/bets-seed.json). Adds only bets that aren't here yet
  // (same bet, same time), so it's safe to run on every device and every new seed version.
  try { const seed = await fetchJSON("data/bets-seed.json").catch(() => null);
    if (seed && seed.bets && localStorage.getItem("lk-seeded") !== String(seed.v || 1)) { let added = 0;
      for (const b of Object.values(seed.bets)) { if (betsList().some(x => sameBet(b, x) && x.at === b.at)) continue; try { await saveBet(b); added++; } catch {} }
      localStorage.setItem("lk-seeded", String(seed.v || 1)); if (added) { toast(`<b>synced.</b> ${added} bet${added > 1 ? "s" : ""} from the claude app added.`, 5000); renderMine(); renderBets(); renderResults(); } } } catch {}
})();
setInterval(() => { try { if (S.view === "games") renderGames(); if (S.view === "mine") renderMine(); if (S.view === "results") renderResults(); } catch {} }, 60000);
</script>
