<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>lockski.ai live</title>
<meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
/* lockski.ai live scoreboard: one file, no server. Scores come straight from the NHL's public feed every 30 seconds. */
:root { --bg:#000; --card:#0e0e0e; --line:#262626; --fg:#fff; --muted:#a3a3a3; --dim:#6b6b6b; }
* { box-sizing:border-box } html,body { background:var(--bg); margin:0 } body { color:var(--fg); font:15px/1.45 "DM Sans",system-ui,sans-serif; text-transform:lowercase; -webkit-font-smoothing:antialiased }
.app { max-width:560px; margin:0 auto; padding:18px 16px 40px }
h1 { margin:0; font-size:34px; font-weight:700; letter-spacing:-.03em } .sub { color:var(--muted); margin:6px 0 14px; font-size:14px }
.feed { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:12px } .feed i { width:8px; height:8px; border-radius:50%; background:#555 } .feed.on i { background:#fff; animation:pulse 1.2s ease-in-out infinite }
@keyframes pulse { 50% { opacity:.25 } }
.strip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; margin-bottom:12px } .strip::-webkit-scrollbar { display:none }
.day { flex:none; width:56px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:8px 0 7px; cursor:pointer; display:grid; justify-items:center; gap:2px; font:inherit }
.day .dw { font-size:10px; letter-spacing:.12em; color:var(--muted); font-weight:700 } .day .dn { font-weight:700; font-size:19px } .day[aria-pressed="true"] { background:#fff; color:#000; border-color:#fff } .day[aria-pressed="true"] .dw { color:#000 }
.list { display:grid; gap:8px }
.game { padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line); display:grid; gap:10px } .game.on { border-color:#555 } .game.past { opacity:.5 }
.gtop { display:flex; justify-content:space-between; font-size:12px; color:var(--muted) } .live { color:var(--fg); font-weight:700; display:inline-flex; align-items:center; gap:6px } .live i { width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.2s ease-in-out infinite }
.teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px }
.side { display:flex; align-items:center; gap:10px; min-width:0 } .side.r { flex-direction:row-reverse; text-align:right }
.tb { width:34px; height:34px; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #2a2a2a; display:grid; place-items:center; overflow:hidden; flex:none } .tb img { width:100%; height:100%; object-fit:contain; padding:3px }
.n b { font-size:16px; font-weight:700; display:block } .n span { font-size:20px; font-weight:700; color:var(--dim) } .n span.w { color:var(--fg) } .n span.t { font-size:13px; font-weight:400; color:var(--muted) }
.at { color:var(--dim); font-size:12px } .fine { color:var(--dim); font-size:12px; text-align:center; margin-top:18px }
</style></head><body><div class="app">
<h1>live</h1><p class="sub">every nhl game, straight from the league's feed.</p>
<div class="feed" id="feed"><i></i>connecting…</div>
<div class="strip" id="strip"></div>
<div class="list" id="list"></div>
<p class="fine">lockski.ai · refreshes every 30 seconds while games are on</p>
</div>
<script>
const LOGO = ab => `logos/${ab}.svg`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let DAYS = [], DAY = null, LAST = 0, STATE = "connecting";
const todayET = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const per = g => { const p = g.periodDescriptor || {}; const n = p.number; const name = p.periodType === "OT" ? "ot" : p.periodType === "SO" ? "so" : ["", "1st", "2nd", "3rd"][n] || "ot"; return g.clock && g.clock.inIntermission ? `end of ${name}` : `${name} ${g.clock ? g.clock.timeRemaining : ""}`; };
async function load() {
  try {
    const r = await fetch("https://api-web.nhle.com/v1/schedule/now", { cache: "no-store" }); if (!r.ok) throw 0;
    const j = await r.json(); DAYS = (j.gameWeek || []).map(d => ({ date: d.date, games: d.games || [] }));
    const s = await fetch("https://api-web.nhle.com/v1/score/now", { cache: "no-store" }); if (s.ok) { const sj = await s.json(); const by = {}; (sj.games || []).forEach(g => by[g.id] = g);
      DAYS.forEach(d => d.games = d.games.map(g => by[g.id] ? { ...g, ...by[g.id] } : g)); }
    STATE = "on"; LAST = Date.now(); if (!DAY || !DAYS.some(d => d.date === DAY)) DAY = (DAYS.find(d => d.date === todayET()) || DAYS[0] || {}).date;
  } catch (e) { STATE = "off"; }
  render();
}
function render() {
  const feed = document.getElementById("feed"), live = DAYS.flatMap(d => d.games).filter(g => g.gameState === "LIVE" || g.gameState === "CRIT").length;
  feed.className = "feed" + (STATE === "on" ? " on" : ""); feed.innerHTML = `<i></i>${STATE === "on" ? `live · ${live ? live + " game" + (live > 1 ? "s" : "") + " in progress" : "no game in progress right now"} · checked ${Math.max(0, Math.round((Date.now() - LAST) / 1000))}s ago` : STATE === "off" ? "can't reach the nhl feed right now · retrying" : "connecting…"}`;
  document.getElementById("strip").innerHTML = DAYS.map(d => { const dt = new Date(d.date + "T12:00:00"); return `<button class="day" data-d="${d.date}" aria-pressed="${d.date === DAY}"><span class="dw">${d.date === todayET() ? "today" : dt.toLocaleDateString([], { weekday: "short" })}</span><span class="dn">${dt.getDate()}</span></button>`; }).join("");
  const day = DAYS.find(d => d.date === DAY), now = Date.now();
  document.getElementById("list").innerHTML = (day ? day.games : []).map(g => {
    const a = g.awayTeam || {}, h = g.homeTeam || {}, st = g.gameState, on = st === "LIVE" || st === "CRIT", done = st === "OFF" || st === "FINAL", ot = (g.periodDescriptor || {}).periodType && (g.periodDescriptor || {}).periodType !== "REG";
    const top = on ? `<span class="live"><i></i>${esc(per(g))}</span>` : done ? `<span>final${ot ? " · " + (g.periodDescriptor.periodType === "SO" ? "so" : "ot") : ""}</span>` : `<span>${fmtTime(g.startTimeUTC)}</span>`;
    const sc = (x, other) => on || done ? `<span class="${x.score > other.score ? "w" : ""}">${x.score ?? 0}</span>` : `<span class="t">${esc(x.placeName && x.placeName.default || "")}</span>`;
    return `<div class="game${on ? " on" : ""}${!on && !done && Date.parse(g.startTimeUTC) < now ? " past" : ""}">
      <div class="gtop">${top}<span>${g.venue && g.venue.default ? esc(g.venue.default) : ""}</span></div>
      <div class="teams"><div class="side"><span class="tb"><img src="${LOGO(a.abbrev)}" alt=""></span><div class="n"><b>${esc(a.abbrev)}</b>${sc(a, h)}</div></div><span class="at">${on || done ? "–" : "at"}</span><div class="side r"><span class="tb"><img src="${LOGO(h.abbrev)}" alt=""></span><div class="n"><b>${esc(h.abbrev)}</b>${sc(h, a)}</div></div></div></div>`; }).join("") || `<p class="fine">no games that day.</p>`;
}
document.getElementById("strip").addEventListener("click", e => { const b = e.target.closest(".day"); if (b) { DAY = b.dataset.d; render(); } });
load(); setInterval(load, 30000); setInterval(render, 5000); document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script></body></html>
